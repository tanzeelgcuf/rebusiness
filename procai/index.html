
<!DOCTYPE html>
<html lang="en">
<head>

  <title>ProcureLink AI - Advanced Agent Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.1); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.5); border-radius: 10px; }

    @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
    .scanner-line { height: 2px; background: linear-gradient(to right, transparent, #3b82f6, transparent); animation: scan 2s linear infinite; }
  </style>
