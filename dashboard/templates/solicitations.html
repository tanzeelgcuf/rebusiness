{% extends "base.html" %}

{% block title %}Solicitations{% endblock %}

{% block content %}
<div x-data="solicitationsApp()">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-3xl font-bold">📋 Solicitations</h2>
        <input type="text" x-model="search" @input="loadSolicitations" placeholder="Search..."
            class="border rounded px-4 py-2 w-64" />
    </div>

    <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Contract ID</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Title</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Location</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Date</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                <template x-for="sol in solicitations" :key="sol.contract_id">
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 text-sm font-mono" x-text="sol.contract_id"></td>
                        <td class="px-6 py-4 text-sm" x-text="sol.title"></td>
                        <td class="px-6 py-4 text-sm text-gray-500" x-text="sol.location || 'N/A'"></td>
                        <td class="px-6 py-4 text-sm text-gray-500" x-text="formatDate(sol.created_at)"></td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 text-xs rounded-full bg-gray-100 text-gray-800"
                                x-text="sol.review_status || 'pending'"></span>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

    <div class="mt-6 flex justify-between items-center">
        <p class="text-sm text-gray-700">
            Showing <span x-text="solicitations.length"></span> of <span x-text="total"></span>
        </p>
        <div class="space-x-2">
            <button @click="prevPage" :disabled="offset === 0"
                class="px-4 py-2 bg-gray-200 rounded disabled:opacity-50">Previous</button>
            <button @click="nextPage" :disabled="offset + limit >= total"
                class="px-4 py-2 bg-gray-200 rounded disabled:opacity-50">Next</button>
        </div>
    </div>
</div>

<script>
    function solicitationsApp() {
        return {
            solicitations: [],
            total: 0,
            limit: 50,
            offset: 0,
            search: '',

            init() {
                this.loadSolicitations();
            },

            async loadSolicitations() {
                try {
                    const params = new URLSearchParams({
                        limit: this.limit,
                        offset: this.offset,
                        search: this.search
                    });
                    const response = await fetch(`/api/solicitations?${params}`);
                    const data = await response.json();
                    if (data.success) {
                        this.solicitations = data.data;
                        this.total = data.total;
                    }
                } catch (error) {
                    console.error('Error loading solicitations:', error);
                }
            },

            formatDate(dateString) {
                return new Date(dateString).toLocaleDateString();
            },

            prevPage() {
                if (this.offset > 0) {
                    this.offset -= this.limit;
                    this.loadSolicitations();
                }
            },

            nextPage() {
                if (this.offset + this.limit < this.total) {
                    this.offset += this.limit;
                    this.loadSolicitations();
                }
            }
        }
    }
</script>
{% endblock %}
