<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RFQ Dashboard{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>

<body class="bg-gray-100">
    <!-- Navigation -->
    <nav class="bg-gradient-to-r from-blue-600 to-blue-800 text-white shadow-lg">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <h1 class="text-2xl font-bold">📊 RFQ Dashboard</h1>
                </div>
                <div class="flex space-x-6">
                    <a href="/" class="hover:text-blue-200 transition">🏠 Home</a>
                    <a href="/solicitations" class="hover:text-blue-200 transition">📋 Solicitations</a>
                    <a href="/rfqs" class="hover:text-blue-200 transition">📄 RFQs</a>
                    <a href="/vendors" class="hover:text-blue-200 transition">🏢 Vendors</a>
                    <a href="/automation" class="hover:text-blue-200 transition">⚙️ Automation</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-4 mt-12">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2026 RFQ Automation System | Camp Sable, LLC</p>
        </div>
    </footer>
</body>

</html>
