{% extends "base.html" %}

{% block title %}Vendor Tracking{% endblock %}

{% block content %}
<div x-data="vendorsApp()">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-3xl font-bold">🏢 ThomasNet Vendor Tracking</h2>
        <div class="flex space-x-3">
            <button @click="groupBy = 'vendor'" :class="groupBy === 'vendor' ? 'bg-blue-600' : 'bg-gray-300'"
                class="text-white px-4 py-2 rounded transition">
                Group by Vendor
            </button>
            <button @click="groupBy = 'product'" :class="groupBy === 'product' ? 'bg-blue-600' : 'bg-gray-300'"
                class="text-white px-4 py-2 rounded transition">
                Group by Product
            </button>
        </div>
    </div>

    <!-- Stats Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="bg-white rounded-lg shadow p-6">
            <h3 class="text-gray-500 text-sm">Total Submissions</h3>
            <p class="text-3xl font-bold" x-text="stats.total_submissions || 0"></p>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
            <h3 class="text-gray-500 text-sm">Successful</h3>
            <p class="text-3xl font-bold text-green-600" x-text="stats.successful_submissions || 0"></p>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
            <h3 class="text-gray-500 text-sm">Unique Vendors</h3>
            <p class="text-3xl font-bold text-blue-600" x-text="stats.unique_vendors || 0"></p>
        </div>
    </div>

    <!-- Submissions Table -->
    <div x-show="groupBy === 'vendor'" class="bg-white rounded-lg shadow overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Vendor Company</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Vendor Name</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Product Searched</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Location</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Date</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                <template x-for="vendor in submissions" :key="vendor.id">
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 text-sm font-medium" x-text="vendor.vendor_company"></td>
                        <td class="px-6 py-4 text-sm" x-text="vendor.vendor_name"></td>
                        <td class="px-6 py-4 text-sm" x-text="vendor.product_searched"></td>
                        <td class="px-6 py-4 text-sm text-gray-500" x-text="vendor.vendor_location || 'N/A'"></td>
                        <td class="px-6 py-4 text-sm text-gray-500" x-text="formatDate(vendor.submission_timestamp)">
                        </td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 text-xs rounded-full"
                                :class="vendor.success ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'">
                                <span x-text="vendor.success ? '✓ Success' : '✗ Failed'"></span>
                            </span>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>

        <template x-if="submissions.length === 0">
            <div class="text-center py-12 text-gray-500">
                <p class="text-xl">No vendor submissions yet</p>
            </div>
        </template>
    </div>

    <!-- Grouped by Product -->
    <div x-show="groupBy === 'product'" class="space-y-4">
        <template x-for="group in productGroups" :key="group.product_searched">
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold" x-text="group.product_searched"></h3>
                    <span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm">
                        <span x-text="group.vendor_count"></span> vendors
                    </span>
                </div>
                <p class="text-sm text-gray-600" x-text="group.vendors"></p>
            </div>
        </template>

        <template x-if="productGroups.length === 0">
            <div class="text-center py-12 text-gray-500 bg-white rounded-lg shadow">
                <p class="text-xl">No submissions yet</p>
            </div>
        </template>
    </div>

    <!-- Pagination -->
    <div class="mt-6 flex justify-between items-center" x-show="groupBy === 'vendor'">
        <p class="text-sm text-gray-700">
            Showing <span x-text="submissions.length"></span> of <span x-text="total"></span> submissions
        </p>
        <div class="space-x-2">
            <button @click="prevPage" :disabled="offset === 0"
                class="px-4 py-2 bg-gray-200 rounded disabled:opacity-50">Previous</button>
            <button @click="nextPage" :disabled="offset + limit >= total"
                class="px-4 py-2 bg-gray-200 rounded disabled:opacity-50">Next</button>
        </div>
    </div>
</div>

<script>
    function vendorsApp() {
        return {
            groupBy: 'vendor',
            submissions: [],
            productGroups: [],
            stats: {},
            total: 0,
            limit: 100,
            offset: 0,

            init() {
                this.loadStats();
                this.loadSubmissions();
                this.loadProductGroups();
            },

            async loadStats() {
                try {
                    const response = await fetch('/api/vendors/stats');
                    const data = await response.json();
                    if (data.success) {
                        this.stats = data.data;
                    }
                } catch (error) {
                    console.error('Error loading stats:', error);
                }
            },

            async loadSubmissions() {
                try {
                    const response = await fetch(`/api/vendors?limit=${this.limit}&offset=${this.offset}`);
                    const data = await response.json();
                    if (data.success) {
                        this.submissions = data.data;
                        this.total = data.total;
                    }
                } catch (error) {
                    console.error('Error loading submissions:', error);
                }
            },

            async loadProductGroups() {
                try {
                    const response = await fetch('/api/vendors/by-product');
                    const data = await response.json();
                    if (data.success) {
                        this.productGroups = data.data;
                    }
                } catch (error) {
                    console.error('Error loading product groups:', error);
                }
            },

            formatDate(dateString) {
                return new Date(dateString).toLocaleString();
            },

            prevPage() {
                if (this.offset > 0) {
                    this.offset -= this.limit;
                    this.loadSubmissions();
                }
            },

            nextPage() {
                if (this.offset + this.limit < this.total) {
                    this.offset += this.limit;
                    this.loadSubmissions();
                }
            }
        }
    }
</script>
{% endblock %}
