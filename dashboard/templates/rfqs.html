{% extends "base.html" %}

{% block title %}RFQ Management{% endblock %}

{% block content %}
<div x-data="rfqsApp()">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-3xl font-bold">📄 RFQ Management</h2>
        <div class="flex space-x-3">
            <button @click="showSelected && regenerateSelected()" x-show="selectedRFQs.length > 0"
                class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded transition">
                🔄 Regenerate Selected (<span x-text="selectedRFQs.length"></span>)
            </button>
        </div>
    </div>

    <!-- RFQ Table -->
    <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left"><input type="checkbox" @change="toggleAll" /></th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Contract ID</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Title</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Type</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Generated</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                <template x-for="rfq in rfqs" :key="rfq.contract_id">
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4">
                            <input type="checkbox" :value="rfq.contract_id" @change="toggleSelect(rfq.contract_id)" />
                        </td>
                        <td class="px-6 py-4 text-sm font-mono" x-text="rfq.contract_id"></td>
                        <td class="px-6 py-4 text-sm" x-text="rfq.solicitation_title || 'N/A'"></td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 text-xs rounded-full"
                                :class="rfq.rfq_type === 'PRODUCT' ? 'bg-blue-100 text-blue-800' : 'bg-green-100 text-green-800'"
                                x-text="rfq.rfq_type"></span>
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-500" x-text="formatDate(rfq.generated_date)"></td>
                        <td class="px-6 py-4 text-sm space-x-2">
                            <button @click="viewRFQ(rfq.contract_id)"
                                class="text-blue-600 hover:text-blue-800">View</button>
                            <button @click="downloadRFQ(rfq.contract_id)"
                                class="text-green-600 hover:text-green-800">Download</button>
                            <button @click="regenerateRFQ(rfq.contract_id)"
                                class="text-purple-600 hover:text-purple-800">Regenerate</button>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>

        <template x-if="rfqs.length === 0">
            <div class="text-center py-12 text-gray-500">
                <p class="text-xl">No RFQs found</p>
            </div>
        </template>
    </div>

    <!-- Pagination -->
    <div class="mt-6 flex justify-between items-center">
        <p class="text-sm text-gray-700">
            Showing <span x-text="rfqs.length"></span> of <span x-text="total"></span> RFQs
        </p>
        <div class="space-x-2">
            <button @click="prevPage" :disabled="offset === 0"
                class="px-4 py-2 bg-gray-200 rounded disabled:opacity-50">Previous</button>
            <button @click="nextPage" :disabled="offset + limit >= total"
                class="px-4 py-2 bg-gray-200 rounded disabled:opacity-50">Next</button>
        </div>
    </div>

    <!-- RFQ Preview Modal -->
    <div x-show="showModal" class="fixed inset-0 z-50 overflow-y-auto" style="display: none;">
        <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 transition-opacity" aria-hidden="true" @click="showModal = false">
                <div class="absolute inset-0 bg-gray-500 opacity-75"></div>
            </div>

            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

            <div
                class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-4xl sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="sm:flex sm:items-start">
                        <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
                            <h3 class="text-lg leading-6 font-medium text-gray-900"
                                x-text="currentRfqId + ' - Preview'"></h3>
                            <div class="mt-4 border rounded p-4 bg-gray-50 overflow-y-auto" style="max-height: 70vh;">
                                <div x-html="currentRfqContent"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button type="button" @click="showModal = false"
                        class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                        Close
                    </button>
                    <button type="button" @click="downloadRFQ(currentRfqId)"
                        class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none sm:ml-3 sm:w-auto sm:text-sm">
                        Download DOCX
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function rfqsApp() {
        return {
            rfqs: [],
            selectedRFQs: [],
            total: 0,
            limit: 50,
            offset: 0,
            showModal: false,
            currentRfqId: '',
            currentRfqContent: 'Loading...',

            init() {
                this.loadRFQs();
            },

            async loadRFQs() {
                try {
                    const response = await fetch(`/api/rfqs?limit=${this.limit}&offset=${this.offset}`);
                    const data = await response.json();
                    if (data.success) {
                        this.rfqs = data.data;
                        this.total = data.total;
                    }
                } catch (error) {
                    console.error('Error loading RFQs:', error);
                    alert('Failed to load RFQs');
                }
            },

            async viewRFQ(contractId) {
                this.currentRfqId = contractId;
                this.currentRfqContent = '<div class="flex justify-center p-8"><span class="animate-spin text-4xl">⏳</span></div>';
                this.showModal = true;

                try {
                    const response = await fetch(`/api/rfqs/${contractId}`);
                    const data = await response.json();
                    if (data.success) {
                        this.currentRfqContent = data.data.html_content || data.data.rfq_content || 'No content available';
                    } else {
                        this.currentRfqContent = '<div class="text-red-500">Failed to load content</div>';
                    }
                } catch (error) {
                    console.error('Error viewing RFQ:', error);
                    this.currentRfqContent = '<div class="text-red-500">Error loading content</div>';
                }
            },

            async downloadRFQ(contractId) {
                window.location.href = `/api/rfqs/${contractId}/download`;
            },

            async regenerateRFQ(contractId) {
                if (!confirm('Regenerate this RFQ? This will overwrite the current version.')) return;

                try {
                    const response = await fetch(`/api/rfqs/${contractId}/regenerate`, {
                        method: 'POST'
                    });
                    const data = await response.json();
                    if (data.success) {
                        alert('RFQ regenerated successfully!');
                        this.loadRFQs();
                    } else {
                        alert('Regeneration failed: ' + data.error);
                    }
                } catch (error) {
                    console.error('Error regenerating RFQ:', error);
                    alert('Failed to regenerate RFQ');
                }
            },

            async regenerateSelected() {
                if (!confirm(`Regenerate ${this.selectedRFQs.length} RFQs?`)) return;

                try {
                    const response = await fetch('/api/rfqs/batch-regenerate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contract_ids: this.selectedRFQs })
                    });
                    const data = await response.json();
                    if (data.success) {
                        alert(`Batch regeneration complete!`);
                        this.selectedRFQs = [];
                        this.loadRFQs();
                    }
                } catch (error) {
                    console.error('Error batch regenerating:', error);
                }
            },

            toggleSelect(contractId) {
                const index = this.selectedRFQs.indexOf(contractId);
                if (index > -1) {
                    this.selectedRFQs.splice(index, 1);
                } else {
                    this.selectedRFQs.push(contractId);
                }
            },

            toggleAll(event) {
                if (event.target.checked) {
                    this.selectedRFQs = this.rfqs.map(r => r.contract_id);
                } else {
                    this.selectedRFQs = [];
                }
            },

            formatDate(dateString) {
                return new Date(dateString).toLocaleDateString();
            },

            prevPage() {
                if (this.offset > 0) {
                    this.offset -= this.limit;
                    this.loadRFQs();
                }
            },

            nextPage() {
                if (this.offset + this.limit < this.total) {
                    this.offset += this.limit;
                    this.loadRFQs();
                }
            }
        }
    }
</script>
{% endblock %}
